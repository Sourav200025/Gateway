<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Preferences - Infinity Gateway</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
</head>
<body>
  <div id="toast-container"></div>
  
  <div id="app-wrapper" class="app-wrapper">
    <div id="view-profile" class="screen-view">
      <div class="header-nav"><div class="icon-btn" onclick="navigateTo('dashboard.html')"><span class="material-symbols-rounded">arrow_back</span></div><div class="nav-title">Preferences</div><div style="width:44px;"></div></div>
      <div class="section-title">CONFIGURATION</div>
      <h1 style="font-size:28px; font-weight:700; margin-bottom:20px; letter-spacing:-1px;">Account Settings</h1>
      
      <div class="summary-box" style="text-align:center; padding:40px 20px;">
        <div style="width:100px; height:100px; margin:0 auto 20px auto; position:relative;"><img id="prof-avatar" src="" style="width:100%; height:100%; border-radius:50%; border:4px solid white; object-fit:cover; box-shadow: var(--glass-shadow);"><div style="position:absolute; bottom:0; right:0; width:36px; height:36px; background:var(--obsidian); color:white; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; border: 3px solid white;" onclick="openModal('edit-profile-modal')"><span class="material-symbols-rounded" style="font-size:18px;">edit</span></div></div>
        <div style="font-size:24px; font-weight:700; color:var(--text-main); margin-bottom:12px; display:flex; align-items:center; justify-content:center; gap:8px;" id="prof-name">... </div>
        <div style="display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.7); border: 1px solid var(--glass-border); color:var(--text-muted); padding:8px 16px; border-radius:50px; font-size:13px; font-weight:500;"><span class="material-symbols-rounded" style="font-size:18px;">history</span> Member since <span id="prof-date">...</span></div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="edit-profile-modal">
    <div class="modal-sheet">
      <div class="modal-close" onclick="closeModal('edit-profile-modal')"><span class="material-symbols-rounded">close</span></div>
      <h3 style="font-size:24px; margin-bottom:12px; font-weight:700; letter-spacing:-0.5px;">Edit Profile</h3>
      <p style="color:var(--text-muted); font-size:14px; margin-bottom:30px;">Manage your public appearance.</p>
      
      <div class="input-wrap" style="margin-bottom:20px;">
        <span class="material-symbols-rounded" style="padding-left:0; font-size:22px; color:var(--text-muted);">person</span>
        <input type="text" id="editNameInput" placeholder="Display Name" style="width:100%; padding:18px 0; font-size:15px;">
      </div>
      
      <div class="input-wrap" style="margin-bottom:35px;">
        <span class="material-symbols-rounded" style="padding-left:0; font-size:22px; color:var(--text-muted);">add_a_photo</span>
        <input type="file" id="editPhotoInput" accept="image/*" style="width:100%; padding:18px 0; font-size:14px; background:transparent;">
      </div>
      
      <button class="btn-main" id="btn-save-prof" onclick="saveProfileName()">Save Changes</button>
      <button class="btn-main" style="background:transparent; color:var(--danger); border:1px solid rgba(225, 29, 72, 0.3); margin-top:15px; box-shadow:none;" onclick="resetProfilePic()">Remove Avatar</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
