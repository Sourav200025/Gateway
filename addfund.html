<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Deposit - Infinity Gateway</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
</head>
<body>
  <div id="toast-container"></div>
  
  <div id="app-wrapper" class="app-wrapper">
    <div id="view-add-fund" class="screen-view">
      <div class="header-nav">
        <div class="icon-btn" onclick="navigateTo('dashboard.html')"><span class="material-symbols-rounded">arrow_back</span></div>
        <div class="nav-title">Deposit</div>
        <div style="width:44px;"></div>
      </div>

      <div class="section-title">INFINITY GATEWAY</div>
      <h1 style="font-size:28px; font-weight:700; margin-bottom:20px; letter-spacing:-1px;">Deposit Funds</h1>

      <div id="add-fund-not-configured" class="hidden summary-box" style="text-align:center; padding:50px 20px;">
        <span class="material-symbols-rounded" style="font-size:64px; margin-bottom:20px; color:var(--text-muted); opacity:0.5;">cloud_off</span>
        <h3 style="font-size:20px; font-weight:600; margin-bottom:12px;">Deposits Suspended</h3>
        <p style="font-size:14px; color:var(--text-muted); margin-bottom:30px; line-height: 1.6;">Add Funds are temporarily Off by the network administrator.</p>
        <button class="btn-main" style="background:white; color:var(--obsidian); box-shadow:none; border:1px solid var(--glass-border);" onclick="navigateTo('dashboard.html')">Return Home</button>
      </div>

      <div id="add-fund-configured" class="hidden">
        <div class="summary-box" style="text-align:center; padding:35px 20px;">
          <p style="font-size:12px; color:var(--text-muted); margin-bottom:10px; font-weight:600; text-transform:uppercase;">UPI Address</p>
          <h2 id="display-upi-id" style="font-size:22px; color:var(--text-main); margin-bottom:20px; font-weight:700;">...</h2>
          <button class="btn-main" style="padding:12px 24px; font-size:14px; width:auto; margin:0 auto; background:white; color:var(--obsidian); border:1px solid var(--glass-border); box-shadow:0 4px 10px rgba(0,0,0,0.05);" onclick="copyText(document.getElementById('display-upi-id').innerText, 'Address Copied!')">
            <span class="material-symbols-rounded" style="font-size:18px;">content_copy</span> Copy Address
          </button>
        </div>

        <div class="input-group">
          <label class="input-label">Deposit Amount</label>
          <div class="input-wrap">
            <span style="color:var(--text-muted); font-size:20px; font-weight:600; margin-right:12px;">₹</span>
            <input type="number" id="addFundAmount" placeholder="0">
          </div>
        </div>

        <div class="input-group">
          <label class="input-label">Payment UTR</label>
          <div class="input-wrap">
            <span class="material-symbols-rounded">tag</span>
            <input type="text" id="addFundUtr" placeholder="Enter 12-Digit Valid UTR" maxlength="12">
          </div>
        </div>

        <button class="btn-main" id="btn-submit-fund" onclick="handleFundRequest()" style="margin-top: 15px;">Confirm Deposit</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
