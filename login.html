<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - Infinity Gateway</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
</head>
<body>
  <div id="toast-container"></div>
  <div id="auth-screen">
    <div style="text-align:center; margin-bottom:40px;">
      <h1 style="font-size:32px; font-weight:700; color:var(--text-main); letter-spacing: -1.5px;">Infinity Gateway</h1>
    </div>
    <div class="auth-card" id="login-card">
      <div class="auth-title">Welcome back</div>
      <div class="auth-subtitle">Securely access your digital assets</div>
      <form id="login-form">
        <div class="input-wrap" style="margin-bottom:20px;">
          <span class="material-symbols-rounded">phone_iphone</span>
          <input type="tel" id="login-phone" placeholder="Number" maxlength="10" required>
        </div>
        <div class="input-wrap" style="margin-bottom:30px;">
          <span class="material-symbols-rounded">lock</span>
          <input type="password" id="login-password" placeholder="Password" required>
          <span class="material-symbols-rounded" style="cursor:pointer; color:var(--text-muted); font-size:22px; margin-right:0; margin-left:10px;" onclick="togglePwd('login-password', this)">visibility</span>
        </div>
        <button type="submit" class="btn-main" id="btn-login">Login</button>
      </form>
      <div style="text-align:center; margin-top:30px; font-size:14px; color:var(--text-muted);">
        Don't have an account? <span style="color:var(--text-main); font-weight:600; cursor:pointer;" onclick="navigateTo('register.html')">Sign up</span>
      </div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
