<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Register - Infinity Gateway</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
</head>
<body>
  <div id="toast-container"></div>
  <div id="auth-screen">
    <div style="text-align:center; margin-bottom:40px;">
      <h1 style="font-size:32px; font-weight:700; color:var(--text-main); letter-spacing: -1.5px;">Infinity Gateway</h1>
    </div>
    <div class="auth-card" id="signup-card">
      <div class="auth-title">Create account</div>
      <div class="auth-subtitle">Join the next-generation financial gateway</div>
      <form id="signup-form">
        <div class="input-wrap" style="margin-bottom:18px;"><span class="material-symbols-rounded">person</span><input type="text" id="reg-name" placeholder="Name" required></div>
        <div class="input-wrap" style="margin-bottom:18px;"><span class="material-symbols-rounded">mail</span><input type="email" id="reg-email" placeholder="Email Address" required></div>
        <div class="input-wrap" style="margin-bottom:18px;"><span class="material-symbols-rounded">phone_iphone</span><input type="tel" id="reg-phone" placeholder="Number" maxlength="10" required></div>
        <div class="input-wrap" style="margin-bottom:30px;">
          <span class="material-symbols-rounded">lock</span>
          <input type="password" id="reg-pass" placeholder="Password" minlength="6" required>
        </div>
        <button type="submit" class="btn-main" id="btn-register">Create Account</button>
      </form>
      <div style="text-align:center; margin-top:30px; font-size:14px; color:var(--text-muted);">
        Already have an account? <span style="color:var(--text-main); font-weight:600; cursor:pointer;" onclick="navigateTo('login.html')">Sign in</span>
      </div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
