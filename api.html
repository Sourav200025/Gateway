<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Developer API - Infinity Gateway</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
</head>
<body>
  <div id="toast-container"></div>
  
  <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>
  <aside class="sidebar-menu" id="sidebar">
    <div class="sidebar-header"><div><h2 style="margin-bottom: 2px;">Infinity Gateway</h2></div></div>
    <div class="menu-list">
      <div class="menu-item" onclick="navigateTo('dashboard.html')"><span class="material-symbols-rounded">space_dashboard</span> Dashboard</div>
      <div class="menu-item" onclick="navigateTo('quickpay.html')"><span class="material-symbols-rounded">send_money</span> Quick Pay</div>
      <div class="menu-item active" onclick="navigateTo('api.html')"><span class="material-symbols-rounded">api</span> Wallet API</div>
      <div class="menu-item" onclick="logout()" style="color:var(--danger);"><span class="material-symbols-rounded">logout</span> Logout</div>
    </div>
  </aside>

  <div id="app-wrapper" class="app-wrapper">
    <div id="view-api" class="screen-view">
      <div class="header-nav">
        <div class="icon-btn" onclick="navigateTo('dashboard.html')"><span class="material-symbols-rounded">arrow_back</span></div>
        <div class="nav-title">Developers</div>
        <div style="width:44px;"></div>
      </div>
      
      <div class="summary-box">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;"><h3 style="font-size:18px; font-weight:700;">API Keys</h3></div>
        <div style="display:flex; gap:12px;">
          <div style="flex:1; background:rgba(255,255,255,0.7); border:1px solid var(--glass-border); border-radius:50px; padding:16px; font-family:monospace; font-size:16px; text-align:center;" id="api-token-val">........</div>
          <div style="background:var(--obsidian); color:white; padding:0 24px; border-radius:50px; display:flex; align-items:center; font-size:14px; cursor:pointer;" onclick="copyText(document.getElementById('api-token-val').innerText, 'Token Copied!')">Copy</div>
        </div>
      </div>

      <div class="summary-box">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;"><h3 style="font-size:18px; font-weight:700;">Endpoints</h3></div>
        <div id="api-url-display" style="font-family:monospace; padding:18px; background:rgba(255,255,255,0.7); border:1px solid var(--glass-border); border-radius:20px; font-size:13px; color:var(--obsidian); word-break:break-all; line-height:1.6; margin-bottom:20px; font-weight: 500;">
          Loading...
        </div>
        <button class="btn-main" style="background: white; color: var(--obsidian); border: 1px solid var(--glass-border); box-shadow: 0 4px 15px rgba(0,0,0,0.05);" onclick="copyApiUrl()">Copy URL</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
